spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

app.admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
app.upload.provider=supabase
app.upload.supabase.url=${SUPABASE_URL}
app.upload.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.upload.supabase.bucket=${SUPABASE_STORAGE_BUCKET:property-images}
